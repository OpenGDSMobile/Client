 <body>
   <div id="map" style="width:100%; height:100%;"></div>
   <div id="mapSelect" class="OGDSPosTopRight_1"></div>
   <div id="processSelect" class="OGDSPosTopRight_2"></div>

   <style>
        .OGDSPosTopRight_1{
            position : absolute;
            z-index : 1000;
            top : 8px;
            left : auto;
            right : 10px;
        }
        .OGDSPosTopRight_2{
            position : absolute;
            z-index : 1000;
            top : 16px;
            left : auto;
            right : 10px;
        }
   </style> 
   <script>
//map----------------------------------------------------------------------------------------------------------
	var sateliteImageLayer;
	var openGDSMObj_visual = new OGDSM.visualization('map');

	function mapSelectUI(openGDSMObj_visual) {
		var ui = new OGDSM.eGovFrameUI();
		ui.baseMapSelect(openGDSMObj_visual, "mapSelect", 'OSM VWorld VWorld_m VWorld_s VWorld_g');	
	}
	function selectProcessUI(openGDSMObj_visual) {
		var ui = new OGDSM.eGovFrameUI();
	//	ui.
	}
	function WPS_Request(request, identifier, inputdata){
	if(request == "GetCapabilities"){
		var Process_list = new Array();
		$.ajax({
        	        url : "http://113.198.80.58/geoserver/ows?service=wps&version=1.0.0&request=GetCapabilities",
        	        type:'GET',
			dataType:'xml',
			success : function (xml) {	
				console.log(xml);
                        var xmlData = $(xml).find("Process");
                        var identifier = "";
                        var value = "";
			var i = 0;
                        $(xmlData).each(function(){
                        value = $(this).find("Identifier").text();              
                        if(value.indexOf('_WPS') > -1){
                                identifier = value.substring(value.indexOf(':')+1, value.indexOf('WPS')-1); 
				Process_list[i] = identifier;
				i++;
				console.log(identifier);
			}}//modify......
			)
			return Process_list;
			},
			error : function (e) {
				console.log(e);
				}
			});
	}
	else if(request == "DescribeProcess"){}
	else if(request == "Execute"){}
	}

	$(function(){
		openGDSMObj_visual.olMapView([127.22, 36.4], 'OSM');
		openGDSMObj_visual.trackingGeoLocation(true);
		sateliteImageLayer =  new ol.layer.Tile({
			title:'index',
			source: new ol.source.TileWMS(({
			url: 'http://113.198.80.58/geoserver/wms',
			params: {'LAYERS': 'TEST3:kompsat2_10801272_epsg3857','TILED':true},
			serverType:'geoserver'
			}))
			});
		openGDSMObj_visual.addMap(sateliteImageLayer);
		var ppp = WPS_Request("GetCapabilities");
		mapSelectUI(openGDSMObj_visual);
	});
   </script>
 </body>
